services:
  backend:
    build: ./backend
    container_name: invente26-attendance-admin-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      TZ: Asia/Kolkata
      LOG_LEVEL: info
      # LOKI_URL: http://loki:3100/loki/api/v1/push
      SERVICE_NAME: invente26-admin-backend
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - admin-network
      - payment_backend_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:4000
    container_name: invente26-attendance-admin-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    networks:
      - admin-network
    restart: unless-stopped

networks:
  admin-network:
    driver: bridge
  payment_backend_network:
    external: true
    name: server-only-compose_backend-network
